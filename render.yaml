# One-click deploy on Render (https://render.com). Adjust plan/region as needed.
services:
  - type: web
    name: valueraq
    runtime: python
    plan: starter            # a persistent disk requires a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /robots.txt
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/valueraq.db
      - key: SITE_URL
        value: https://www.valueraq.com
      - key: ENFORCE_CANONICAL_HOST
        value: "1"           # www.valueraq.com resolves; every other host 301s to it
      - key: HEALTH_CHECK_PATH
        value: /robots.txt   # must match healthCheckPath above; exempt from the 301
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_FEATURED_LISTING
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
