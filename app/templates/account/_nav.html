<nav class="admin-nav" aria-label="Account">
  <a href="/account/" {% if current_path == '/account/' %}aria-current="page"{% endif %}>Overview</a>
  <a href="/account/reports/" {% if current_path.startswith('/account/reports') %}aria-current="page"{% endif %}>Reports</a>
  <a href="/account/watchlist/" {% if current_path.startswith('/account/watchlist') %}aria-current="page"{% endif %}>Watchlist</a>
