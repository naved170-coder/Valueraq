{% extends "base.html" %}
{% block title %}Log in | {{ BRAND }}{% endblock %}
{% block main %}
<div class="wrap page-head narrow">
  <h1>Log in</h1>
  {% if error %}<p class="alert bad" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="l-pw">Password</label><input id="l-pw" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>New here? <a href="/signup/{% if next %}?next={{ next|urlencode }}{% endif %}">Create a free account</a></p>
</div>
{% endblock %}
