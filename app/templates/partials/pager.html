{% if pages > 1 %}
<nav class="pager" aria-label="Pagination">
  {% if page > 1 %}<a href="{{ base if page == 2 else base ~ 'page/' ~ (page - 1) ~ '/' }}" rel="prev">← Previous</a>{% endif %}
  {% for p in range(1, pages + 1) %}
    {% if p == page %}<span aria-current="page">{{ p }}</span>
    {% elif p == 1 or p == pages or (p - page)|abs <= 2 %}<a href="{{ base if p == 1 else base ~ 'page/' ~ p ~ '/' }}">{{ p }}</a>
    {% elif (p - page)|abs == 3 %}<span>…</span>{% endif %}
  {% endfor %}
  {% if page < pages %}<a href="{{ base ~ 'page/' ~ (page + 1) ~ '/' }}" rel="next">Next →</a>{% endif %}
</nav>
{% endif %}
