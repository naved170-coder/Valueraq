{% extends "admin/_layout.html" %}
{% block admin %}
<h1>Users</h1>
<div class="table-wrap mt"><table><thead><tr><th>Email</th><th>Role</th><th>Plan</th><th>Subscription</th><th>Joined</th><th>Grant plan</th></tr></thead><tbody>
{% for u in rows %}<tr><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.plan }}</td><td>{{ u.subscription_status or '—' }}</td><td>{{ u.created_at|human_date }}</td>
<td><form method="post" class="row"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="user_id" value="{{ u.id }}"><select name="plan" aria-label="Plan"><option value="free">Free</option><option value="pro" {% if u.plan == 'pro' %}selected{% endif %}>Pro</option></select><button class="btn small quiet">Set</button></form></td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
