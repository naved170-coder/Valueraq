{% extends "admin/_layout.html" %}
{% block admin %}
<h1>Contact messages</h1>
<div class="stack mt">{% for m in rows %}<article class="panel"><p class="meta-line"><span>{{ m.created_at|human_date }}</span><span>{{ m.name or 'No name' }} · {{ m.email }}</span><span>{{ m.topic }}</span></p><p>{{ m.message }}</p></article>{% else %}<p class="empty">No messages.</p>{% endfor %}</div>
{% endblock %}
