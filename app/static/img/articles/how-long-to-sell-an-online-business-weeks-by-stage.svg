<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" font-family="Arial, Helvetica, sans-serif"><title>Example plan: weeks spent on each stage</title><rect width="720" height="364" fill="#ffffff"/><text x="24" y="38" font-size="20" font-weight="700" fill="#0f1c19">Example plan: weeks spent on each stage</text><text x="196" y="87" font-size="15" text-anchor="end" fill="#0f1c19">Prepare</text><rect x="210" y="68" width="300.0" height="28" rx="5" fill="#0d6a54"/><text x="520.0" y="87" font-size="15" font-weight="700" fill="#0f1c19">3 wk</text><text x="196" y="133" font-size="15" text-anchor="end" fill="#0f1c19">Find a buyer</text><rect x="210" y="114" width="400.0" height="28" rx="5" fill="#d99a14"/><text x="620.0" y="133" font-size="15" font-weight="700" fill="#0f1c19">4 wk</text><text x="196" y="179" font-size="15" text-anchor="end" fill="#0f1c19">Letter of intent</text><rect x="210" y="160" width="100.0" height="28" rx="5" fill="#0d6a54"/><text x="320.0" y="179" font-size="15" font-weight="700" fill="#0f1c19">1 wk</text><text x="196" y="225" font-size="15" text-anchor="end" fill="#0f1c19">Due diligence</text><rect x="210" y="206" width="400.0" height="28" rx="5" fill="#d99a14"/><text x="620.0" y="225" font-size="15" font-weight="700" fill="#0f1c19">4 wk</text><text x="196" y="271" font-size="15" text-anchor="end" fill="#0f1c19">Contract and escrow</text><rect x="210" y="252" width="200.0" height="28" rx="5" fill="#0d6a54"/><text x="420.0" y="271" font-size="15" font-weight="700" fill="#0f1c19">2 wk</text><text x="196" y="317" font-size="15" text-anchor="end" fill="#0f1c19">Handover</text><rect x="210" y="298" width="100.0" height="28" rx="5" fill="#d99a14"/><text x="320.0" y="317" font-size="15" font-weight="700" fill="#0f1c19">1 wk</text><text x="696" y="356" font-size="11" text-anchor="end" fill="#53625d">valueraq.com</text></svg>