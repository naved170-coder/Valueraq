<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img" font-family="Arial, Helvetica, sans-serif"><title>Payback period if profit falls, in months (example)</title><rect width="720" height="272" fill="#ffffff"/><text x="24" y="38" font-size="20" font-weight="700" fill="#0f1c19">Payback period if profit falls, in months (example)</text><text x="196" y="87" font-size="15" text-anchor="end" fill="#0f1c19">No drop</text><rect x="210" y="68" width="280.2" height="28" rx="5" fill="#0d6a54"/><text x="500.2" y="87" font-size="15" font-weight="700" fill="#0f1c19">36 months</text><text x="196" y="133" font-size="15" text-anchor="end" fill="#0f1c19">10% drop</text><rect x="210" y="114" width="311.3" height="28" rx="5" fill="#d99a14"/><text x="531.3" y="133" font-size="15" font-weight="700" fill="#0f1c19">40 months</text><text x="196" y="179" font-size="15" text-anchor="end" fill="#0f1c19">20% drop</text><rect x="210" y="160" width="350.2" height="28" rx="5" fill="#0d6a54"/><text x="570.2" y="179" font-size="15" font-weight="700" fill="#0f1c19">45 months</text><text x="196" y="225" font-size="15" text-anchor="end" fill="#0f1c19">30% drop</text><rect x="210" y="206" width="400.0" height="28" rx="5" fill="#d99a14"/><text x="620.0" y="225" font-size="15" font-weight="700" fill="#0f1c19">51.4 months</text><text x="696" y="264" font-size="11" text-anchor="end" fill="#53625d">valueraq.com</text></svg>